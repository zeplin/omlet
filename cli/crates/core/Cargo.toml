[package]
name = "omlet"
version = "0.1.0"
edition = "2021"

[lib]
name = "omlet"

[dependencies]
ahash = { version = "0.7.6", features = ["serde"] }
relative-path = { version = "1.6.0", features = ["serde"] }
serde = { version = "1.0", features = ["rc"] }
swc_atoms = "10.0.0"
swc_common = { version = "26.0.0", features = ["concurrent", "tty-emitter"] }
swc_ecma_ast = { version = "29.0.1", features = ["serde-impl"] }
swc_ecma_parser = { version = "45.1.3", features = ["typescript"] }
swc_ecma_transforms_base = "49.0.1"
swc_ecma_visit = "29.0.0"
regex = "1.5.4"

logger = { path = "../logger" }
utils = { path = "../utils" }
serde_json = "1.0.81"
indexmap = "1.8.1"
lazy_static = "1.4.0"
derivative = "2.2.0"
pathdiff = "0.2.1"

[dev-dependencies]
snap = { path = "../snap" }
